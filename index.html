<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card Component</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Product Card Component -->
    <div class="product-card">
        <div class="card-image">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.0.3" alt="Wireless Headphones">
        </div>
        <div class="card-content">
            <h2 class="card-title">Wireless Headphones</h2>
            <p class="card-description">Experience premium sound quality and active noise cancellation with up to 30 hours of battery life.</p>
            <button class="card-btn">Add to Cart</button>
        </div>
    </div>

</body>
</html>
